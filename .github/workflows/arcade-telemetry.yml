name: Generate Arcade Telemetry

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate contribution arcade shooter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_arcade.py --test

      - name: Generate Engineering Arsenal tech grid
        run: |
          python3 scripts/generate_tech_grid.py

      - name: Validate portfolio asset integrity
        run: |
          python3 scripts/validate_portfolio.py

      - name: Commit & push updated telemetry assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/arcade/ assets/tech-grid.svg assets/tech-strip.svg
          git diff --staged --quiet || git commit -m "chore(cron): refresh GitHub arcade shooter telemetry assets"
          git push
