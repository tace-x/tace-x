name: Generate Contribution Snake & Arcade Telemetry

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: tace-x
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark

      - name: Generate contribution arcade shooter
        run: |
          python3 scripts/generate_arcade.py

      - name: Validate portfolio asset integrity
        run: |
          python3 scripts/validate_portfolio.py

      - name: Commit & push updated telemetry assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg assets/arcade/
          git diff --staged --quiet || git commit -m "chore(cron): refresh GitHub contribution snake and arcade assets"
          git push
