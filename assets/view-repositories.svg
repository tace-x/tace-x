<svg width="280" height="44" viewBox="0 0 280 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>View All Repositories (@tace-x)</title>
  <desc>Direct link to Immanuel Melbin's public GitHub repository catalog</desc>
  <defs>
    <linearGradient id="btnBg" x1="0" y1="0" x2="280" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1320"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Button Base -->
  <rect x="1" y="1" width="278" height="42" rx="8" fill="url(#btnBg)" stroke="#1E293B" stroke-width="1"/>
  <rect x="1" y="1" width="278" height="42" rx="8" fill="none" stroke="#00F0FF" stroke-opacity="0.45" stroke-width="1.2"/>

  <!-- Left Accent Notch -->
  <path d="M1 9v26" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Repository Icon -->
  <g transform="translate(24, 14)">
    <!-- Book/Repo Spine & Pages -->
    <path d="M2 2.5C2 1.67 2.67 1 3.5 1H13c.55 0 1 .45 1 1v11.5c0 .28-.22.5-.5.5H3.5C2.67 14 2 13.33 2 12.5V2.5z" fill="#071524" stroke="#00F0FF" stroke-width="1.2"/>
    <path d="M2 11.5C2 10.67 2.67 10 3.5 10H14" stroke="#00F0FF" stroke-width="1.2"/>
    <circle cx="5.5" cy="5.5" r="1" fill="#38BDF8"/>
  </g>

  <!-- Button Label -->
  <text x="52" y="26.5" fill="#F8FAFC" font-family="'JetBrains Mono', -apple-system, BlinkMacSystemFont, monospace" font-size="11.5" font-weight="800" letter-spacing="1.2">VIEW ALL REPOSITORIES</text>

  <!-- Chevron Arrow -->
  <path d="M250 18l4 4-4 4" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)"/>
</svg>

