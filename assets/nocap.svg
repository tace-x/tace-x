<svg width="900" height="360" viewBox="0 0 900 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>NO CAP (TruthLens) — Rumour Intelligence &amp; Verification Desk</title>
  <defs>
    <linearGradient id="nocapBg" x1="20" y1="15" x2="880" y2="345" gradientUnits="userSpaceOnUse">
      <stop stop-color="#140924"/>
      <stop offset="0.5" stop-color="#0B0616"/>
      <stop offset="1" stop-color="#05020A"/>
    </linearGradient>
    <linearGradient id="nocapRail" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.33" stop-color="#EC4899"/>
      <stop offset="0.66" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="nocapHalo" cx="0" cy="0" r="1" gradientTransform="translate(740 180) rotate(90) scale(180)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#00F0FF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="nocapGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="nocapGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .nocapPulse { animation: ncP 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .nocapFlow { stroke-dasharray: 6 8; animation: ncF 6s linear infinite; }
    @keyframes ncP { 0%,100% { opacity: 0.6; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes ncF { to { stroke-dashoffset: -112; } }
    @media (prefers-reduced-motion: reduce) { .nocapPulse, .nocapFlow { animation: none !important; } }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="356" rx="24" fill="url(#nocapBg)" stroke="#381E68" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="356" rx="24" fill="url(#nocapGrid)"/>
  <circle cx="740" cy="180" r="180" fill="url(#nocapHalo)"/>

  <!-- Top Badges -->
  <rect x="42" y="30" width="260" height="30" rx="15" fill="#20113D" stroke="#7C3AED" stroke-width="1.2"/>
  <circle class="nocapPulse" cx="59" cy="45" r="4.5" fill="#A855F7" filter="url(#nocapGlow)"/>
  <text x="73" y="50" fill="#D8B4FE" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" letter-spacing="1.5">NVIDIA NIM // TRUTHLENS DESK</text>

  <rect x="716" y="30" width="142" height="30" rx="15" fill="#0C202E" stroke="#00F0FF" stroke-width="1.2"/>
  <circle class="nocapPulse" cx="732" cy="45" r="4" fill="#00F0FF"/>
  <text x="744" y="50" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" letter-spacing="1">GEMMA 4 REASONING</text>

  <!-- Title & Description -->
  <g transform="translate(42, 82)">
    <text x="0" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5">NO CAP (TruthLens)</text>
    <text x="0" y="68" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="14.5" font-weight="800" letter-spacing="1.5">RUMOUR INTELLIGENCE &amp; AI VERIFICATION ENGINE</text>

    <text x="0" y="102" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="500">
      <tspan x="0" dy="0">Adversarial intelligence platform extracting claim entities, cross-evaluating sources,</tspan>
      <tspan x="0" dy="22">and producing mathematically bounded veracity verdicts via accelerated NVIDIA NIM endpoints.</tspan>
    </text>
  </g>

  <!-- Rumour Extraction & Verification Pipeline Rail -->
  <g transform="translate(44, 230)">
    <path class="nocapFlow" d="M10 26H800" stroke="url(#nocapRail)" stroke-width="3"/>

    <!-- Step 1: Ingestion -->
    <g transform="translate(10, 0)">
      <circle cx="26" cy="26" r="16" fill="#140924" stroke="#8B5CF6" stroke-width="2.5"/>
      <circle cx="26" cy="26" r="6" fill="#8B5CF6"/>
      <text x="26" y="58" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">Claim Ingestion</text>
      <text x="26" y="73" text-anchor="middle" fill="#C4B5FD" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Text &amp; Audio Input</text>
    </g>

    <!-- Step 2: Entity Extraction -->
    <g transform="translate(205, 0)">
      <circle cx="26" cy="26" r="16" fill="#140924" stroke="#EC4899" stroke-width="2.5"/>
      <circle cx="26" cy="26" r="6" fill="#EC4899"/>
      <text x="26" y="58" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">Fact Extraction</text>
      <text x="26" y="73" text-anchor="middle" fill="#F472B6" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Structured Claims</text>
    </g>

    <!-- Step 3: NVIDIA NIM -->
    <g transform="translate(400, 0)">
      <circle cx="26" cy="26" r="16" fill="#140924" stroke="#00F0FF" stroke-width="2.5"/>
      <circle cx="26" cy="26" r="6" fill="#00F0FF"/>
      <text x="26" y="58" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">NVIDIA NIM</text>
      <text x="26" y="73" text-anchor="middle" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Gemma 4 Inference</text>
    </g>

    <!-- Step 4: Cross-Check -->
    <g transform="translate(605, 0)">
      <circle cx="26" cy="26" r="16" fill="#140924" stroke="#3B82F6" stroke-width="2.5"/>
      <circle cx="26" cy="26" r="6" fill="#3B82F6"/>
      <text x="26" y="58" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">Similarity Matrix</text>
      <text x="26" y="73" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Cosine Clustered</text>
    </g>

    <!-- Step 5: Veracity Score -->
    <g transform="translate(780, 0)">
      <circle cx="26" cy="26" r="16" fill="#140924" stroke="#10B981" stroke-width="2.5"/>
      <circle cx="26" cy="26" r="6" fill="#10B981" filter="url(#nocapGlow)"/>
      <text x="26" y="58" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">Veracity Index</text>
      <text x="26" y="73" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Calibrated Score</text>
    </g>
  </g>
</svg>
