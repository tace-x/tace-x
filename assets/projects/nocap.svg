      <stop stop-color="#070A0F"/>
      <stop offset="1" stop-color="#0B0F17"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="860" height="110" rx="10" fill="url(#bg_nocap)" stroke="#1E293B" stroke-width="1.2"/>

