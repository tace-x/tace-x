  <!-- Description -->
  <text x="24" y="85" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400">AI-powered rumour intelligence desk — dissects viral claims, computes credibility scores v</text>

  <!-- Language strip -->
  <text x="24" y="100" fill="#8B5CF6" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="0.5">TypeScript  ·  React 19  ·  NVIDIA NIM</text>

