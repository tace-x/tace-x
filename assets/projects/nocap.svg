  <!-- Tag pill -->
  <rect x="24" y="18" width="132" height="18" rx="9" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="90" y="30" text-anchor="middle" fill="#8B5CF6" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="1.5">AI VERIFICATION</text>

