<svg width="900" height="360" viewBox="0 0 900 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Kalvichat — Secure Real-Time Messaging &amp; Identity Workspace</title>
  <defs>
    <linearGradient id="kalviBg" x1="20" y1="15" x2="880" y2="345" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071926"/>
      <stop offset="0.5" stop-color="#040F18"/>
      <stop offset="1" stop-color="#02070C"/>
    </linearGradient>
    <linearGradient id="kalviRail" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.33" stop-color="#10B981"/>
      <stop offset="0.66" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="kalviHalo" cx="0" cy="0" r="1" gradientTransform="translate(740 180) rotate(90) scale(180)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="kalviGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="kalviGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .kalviPulse { animation: kvP 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .kalviFlow { stroke-dasharray: 6 8; animation: kvF 6s linear infinite; }
    @keyframes kvP { 0%,100% { opacity: 0.6; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes kvF { to { stroke-dashoffset: -112; } }
    @media (prefers-reduced-motion: reduce) { .kalviPulse, .kalviFlow { animation: none !important; } }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="356" rx="24" fill="url(#kalviBg)" stroke="#13364C" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="356" rx="24" fill="url(#kalviGrid)"/>
  <circle cx="740" cy="180" r="180" fill="url(#kalviHalo)"/>

  <!-- Top Badges -->
  <rect x="42" y="30" width="250" height="30" rx="15" fill="#0D2738" stroke="#0284C7" stroke-width="1.2"/>
  <circle class="kalviPulse" cx="59" cy="45" r="4.5" fill="#38BDF8" filter="url(#kalviGlow)"/>
  <text x="73" y="50" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" letter-spacing="1.5">REACT 19 // DISTRIBUTED PLATFORM</text>

  <rect x="700" y="30" width="158" height="30" rx="15" fill="#0C251C" stroke="#10B981" stroke-width="1.2"/>
  <circle class="kalviPulse" cx="716" cy="45" r="4" fill="#10B981"/>
  <text x="728" y="50" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" letter-spacing="1">FIRESTORE TESTED</text>

  <!-- Title & Description -->
  <g transform="translate(42, 82)">
    <text x="0" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5">Kalvichat</text>
    <text x="0" y="68" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="14.5" font-weight="800" letter-spacing="1.5">SECURE REAL-TIME MESSAGING &amp; IDENTITY PLATFORM</text>

    <text x="0" y="102" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="500">
      <tspan x="0" dy="0">Privacy-preserving real-time communication platform with identity resolution, server-gated</tspan>
      <tspan x="0" dy="22">admin moderation, granular security rules, and low-latency Cloud Firestore subscriptions.</tspan>
    </text>
  </g>

  <!-- Messaging Pipeline Architecture Rail -->
  <g transform="translate(44, 230)">
    <path class="kalviFlow" d="M10 26H800" stroke="url(#kalviRail)" stroke-width="3"/>

    <!-- Step 1: React 19 Client -->
    <g transform="translate(10, 0)">
      <circle cx="26" cy="26" r="16" fill="#071926" stroke="#38BDF8" stroke-width="2.5"/>
      <circle cx="26" cy="26" r="6" fill="#38BDF8"/>
      <text x="26" y="58" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">React 19 Client</text>
      <text x="26" y="73" text-anchor="middle" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Zero Main Blocking</text>
    </g>

    <!-- Step 2: Auth & Session -->
    <g transform="translate(205, 0)">
      <circle cx="26" cy="26" r="16" fill="#071926" stroke="#10B981" stroke-width="2.5"/>
      <circle cx="26" cy="26" r="6" fill="#10B981"/>
      <text x="26" y="58" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">Identity Guard</text>
      <text x="26" y="73" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Firebase Auth</text>
    </g>

    <!-- Step 3: Security Rules -->
    <g transform="translate(400, 0)">
      <circle cx="26" cy="26" r="16" fill="#071926" stroke="#6366F1" stroke-width="2.5"/>
      <circle cx="26" cy="26" r="6" fill="#6366F1"/>
      <text x="26" y="58" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">Rules Engine</text>
      <text x="26" y="73" text-anchor="middle" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Granular ACLs</text>
    </g>

    <!-- Step 4: Firestore Sync -->
    <g transform="translate(605, 0)">
      <circle cx="26" cy="26" r="16" fill="#071926" stroke="#F59E0B" stroke-width="2.5"/>
      <circle cx="26" cy="26" r="6" fill="#F59E0B"/>
      <text x="26" y="58" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">Cloud Firestore</text>
      <text x="26" y="73" text-anchor="middle" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Real-Time Snapshots</text>
    </g>

    <!-- Step 5: Verified Source -->
    <g transform="translate(780, 0)">
      <circle cx="26" cy="26" r="16" fill="#071926" stroke="#38BDF8" stroke-width="2.5"/>
      <circle cx="26" cy="26" r="6" fill="#38BDF8" filter="url(#kalviGlow)"/>
      <text x="26" y="58" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">Verified Repo</text>
      <text x="26" y="73" text-anchor="middle" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">tace-x/Kalvichat</text>
    </g>
  </g>
</svg>
