<svg width="900" height="370" viewBox="0 0 900 370" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>TerminalVision — High-Performance Native Rust Terminal File Manager &amp; PTY Cockpit</title>
  <defs>
    <linearGradient id="tvBg" x1="20" y1="15" x2="880" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="tvBorder" x1="0" y1="0" x2="900" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="barGlow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F97316"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="tvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="tvGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .tvPulse { animation: tvP 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .tvBlink { animation: tvB 1s steps(2, start) infinite; }
    @keyframes tvP { 0%,100% { opacity: 0.6; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }
    @keyframes tvB { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .tvPulse, .tvBlink { animation: none !important; } }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="366" rx="24" fill="url(#tvBg)" stroke="#1E293B" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="366" rx="24" fill="url(#tvGrid)"/>

  <!-- Window Header -->
  <rect x="2" y="2" width="896" height="42" rx="24" fill="#0B1320" stroke="#1E293B" stroke-width="1"/>
  <rect x="2" y="22" width="896" height="22" fill="#0B1320"/>
  
  <!-- Window Controls -->
  <circle cx="28" cy="22" r="6" fill="#EF4444"/>
  <circle cx="48" cy="22" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="22" r="6" fill="#10B981"/>

  <!-- Tab Label -->
  <rect x="96" y="8" width="270" height="28" rx="7" fill="#070D18" stroke="#1E293B"/>
  <circle cx="112" cy="22" r="4" fill="#F97316"/>
  <text x="124" y="27" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">terminalvision :: main.rs [PTY]</text>

  <!-- Top Right Badges -->
  <rect x="740" y="9" width="138" height="26" rx="13" fill="#1C140E" stroke="#EA580C" stroke-width="1"/>
  <circle class="tvPulse" cx="754" cy="22" r="4" fill="#F97316"/>
  <text x="766" y="26" fill="#FDBA74" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" letter-spacing="1">RUST 2024</text>

  <!-- Body Content -->
  <!-- Left Side: Project Identity -->
  <g transform="translate(36, 68)">
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#0F172A" stroke="#334155"/>
    <text x="12" y="17" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" letter-spacing="1.5">FLAGSHIP SYSTEM</text>
    
    <text x="0" y="62" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">TerminalVision</text>
    <text x="0" y="88" fill="#F97316" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" letter-spacing="1.5">NATIVE RUST COCKPIT · LIVE PTY RUNTIME</text>
    
    <text x="0" y="118" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">
      <tspan x="0" dy="0">High-performance terminal file manager, dual-pane navigator, and integrated shell.</tspan>
      <tspan x="0" dy="20">Combines Ratatui TUI, in-process Git analytics, async storage heatmap,</tspan>
      <tspan x="0" dy="20">and a real live Unix PTY terminal ready for instant keyboard control.</tspan>
    </text>

    <!-- Specs Matrix -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="105" height="30" rx="8" fill="#0A1E14" stroke="#059669"/>
      <text x="10" y="19" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">⚡ 60 FPS TUI</text>

      <rect x="115" y="0" width="125" height="30" rx="8" fill="#141E33" stroke="#2563EB"/>
      <text x="125" y="19" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">🦀 NATIVE RUST</text>

      <rect x="250" y="0" width="120" height="30" rx="8" fill="#241429" stroke="#9333EA"/>
      <text x="260" y="19" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">🖥️ LIVE PTY</text>

      <rect x="380" y="0" width="135" height="30" rx="8" fill="#2A1B0E" stroke="#EA580C"/>
      <text x="390" y="19" fill="#FB923C" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">🖼️ KITTY/SIXÈL</text>
    </g>
  </g>

  <!-- Right Side: Live Terminal Pane Visualization -->
  <g transform="translate(565, 62)">
    <rect x="0" y="0" width="300" height="236" rx="14" fill="#05080E" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Mini Terminal Titlebar -->
    <rect x="0" y="0" width="300" height="26" rx="14" fill="#09101C"/>
    <rect x="0" y="16" width="300" height="10" fill="#09101C"/>
    <text x="14" y="17" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">PANEL 01: DUAL PANE VFS</text>
    <text x="286" y="17" text-anchor="end" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">SYNCED</text>

    <!-- Terminal Code / VFS Output -->
    <g transform="translate(14, 42)" font-family="'JetBrains Mono', monospace" font-size="10.5">
      <text y="0" fill="#38BDF8">📁 src/pty/</text>
      <text y="17" fill="#E2E8F0">  ├── 🦀 daemon.rs <tspan fill="#64748B">[4.1 KB]</tspan></text>
      <text y="34" fill="#E2E8F0">  ├── 🦀 stream.rs <tspan fill="#64748B">[8.6 KB]</tspan></text>
      <text y="51" fill="#F97316">  └── 🦀 session.rs <tspan fill="#64748B">[12.4 KB]</tspan></text>
      
      <line x1="0" y1="65" x2="272" y2="65" stroke="#1E293B" stroke-width="1"/>
      
      <text y="82" fill="#64748B">// Embedded Unix Pseudo-Terminal (PTY)</text>
      <text y="100" fill="#10B981">$ cargo run --release</text>
      <text y="117" fill="#F8FAFC">⚡ TerminalVision v0.9.4</text>
      <text y="134" fill="#94A3B8">> Dual-pane VFS initialized</text>
      <text y="151" fill="#94A3B8">> Storage Vision: 14.8 GB scanned</text>
      <text y="168" fill="#10B981">ready ❯ <tspan fill="#F8FAFC">_</tspan><tspan class="tvBlink" fill="#10B981">█</tspan></text>
    </g>
  </g>

  <!-- Bottom Accent Stripe & Shortcuts -->
  <line x1="36" y1="324" x2="864" y2="324" stroke="#1E293B" stroke-width="1"/>
  <text x="36" y="348" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">
    KEYBINDINGS: <tspan fill="#CBD5E1">Ctrl+T / F12</tspan> Focus Terminal  •  <tspan fill="#CBD5E1">⌘K / Ctrl+K</tspan> Action Hub  •  <tspan fill="#CBD5E1">Space</tspan> Multi-Select  •  <tspan fill="#CBD5E1">⌘S</tspan> Storage Vision
  </text>
  <text x="864" y="348" text-anchor="end" fill="#F97316" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">
    GITHUB.COM/TACE-X/TERMINALVISION →
  </text>
</svg>
