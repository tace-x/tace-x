<svg width="1000" height="520" viewBox="0 0 1000 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>IMMANUEL MELBIN (@tace-x) — Systems, AI &amp; Product Engineering</title>
  <desc>Developer profile hero for Immanuel Melbin (@tace-x), building native systems, AI platforms, and high-performance digital products.</desc>
  <defs>
    <linearGradient id="panel" x1="40" y1="20" x2="960" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F17"/>
      <stop offset="0.45" stop-color="#070A0F"/>
      <stop offset="1" stop-color="#030508"/>
    </linearGradient>
    <linearGradient id="line" x1="55" y1="0" x2="945" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#10B981"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="0.8" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="translate(786 231) rotate(90) scale(185)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#030508" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <clipPath id="panelClip"><rect x="2" y="2" width="996" height="516" rx="32"/></clipPath>
  </defs>
  <style>
    .dash { stroke-dasharray: 8 12; animation: flow 7s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
    .pulse-b { animation-delay: -0.9s; }
    .pulse-c { animation-delay: -1.8s; }
    .scanner { animation: scan 8s ease-in-out infinite; }
    .statement { opacity: 0; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .s1 { opacity: 1; animation-name: s1; }
    .s2 { animation-name: s2; }
    .s3 { animation-name: s3; }
    .s4 { animation-name: s4; }
    .s5 { animation-name: s5; }
    @keyframes flow { to { stroke-dashoffset: -160; } }
    @keyframes pulse { 0%,100% { transform: scale(.82); opacity: .62; } 50% { transform: scale(1.18); opacity: 1; } }
    @keyframes scan { 0%,100% { transform: translateX(-210px); opacity: 0; } 16% { opacity: .65; } 50% { transform: translateX(890px); opacity: .12; } 51% { opacity: 0; } }
    @keyframes s1 { 0%,16% { opacity:1 } 20%,96% { opacity:0 } 100% { opacity:1 } }
    @keyframes s2 { 0%,16%,40%,100% { opacity:0 } 20%,36% { opacity:1 } }
    @keyframes s3 { 0%,36%,60%,100% { opacity:0 } 40%,56% { opacity:1 } }
    @keyframes s4 { 0%,56%,80%,100% { opacity:0 } 60%,76% { opacity:1 } }
    @keyframes s5 { 0%,76%,100% { opacity:0 } 80%,96% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) {
      .dash,.pulse,.scanner,.statement { animation: none !important; }
      .statement { opacity: 0; }
      .s1 { opacity: 1; }
    }
  </style>

  <!-- Frame Background -->
  <rect x="2" y="2" width="996" height="516" rx="32" fill="url(#panel)" stroke="#222B38" stroke-width="2"/>
  <g clip-path="url(#panelClip)">
    <rect x="2" y="2" width="996" height="516" fill="url(#grid)"/>
    <circle cx="786" cy="231" r="210" fill="url(#orb)"/>
    <circle cx="850" cy="128" r="94" fill="#6366F1" fill-opacity="0.06" filter="url(#bigGlow)"/>
    <rect class="scanner" x="0" y="62" width="210" height="320" fill="url(#line)" opacity="0.22"/>
  </g>

  <!-- Top Bar -->
  <circle cx="56" cy="48" r="5" fill="#10B981" filter="url(#softGlow)"/>
  <text x="72" y="54" fill="#94A3B8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="700" letter-spacing="2">TACE-X // ARCHITECT CONSOLE</text>
  
  <rect x="770" y="32" width="174" height="32" rx="16" fill="#0A2218" stroke="#059669" stroke-width="1.2"/>
  <circle class="pulse" cx="788" cy="48" r="5" fill="#10B981"/>
  <text x="802" y="53" fill="#6EE7B7" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="800" letter-spacing="1.5">LIVE &amp; SHIPPING</text>
  <path d="M56 82H944" stroke="url(#line)" stroke-width="1.5"/>

  <!-- Identity Block -->
  <text x="56" y="132" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" letter-spacing="4">SYSTEMS  •  AI  •  PRODUCT</text>
  <text x="52" y="202" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="-1">IMMANUEL</text>
  <text x="52" y="266" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="-1">MELBIN</text>
  <text x="56" y="306" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="700" letter-spacing="2">RUST  •  TYPESCRIPT  •  AI REASONING  •  PTY</text>
  <text x="56" y="344" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">Low-level terminal cockpits, high-stakes decision AI, and ultra-responsive workspaces.</text>

  <!-- Interactive Telemetry Radar -->
  <g opacity="0.96">
    <circle cx="803" cy="222" r="76" fill="#070D14" stroke="#0284C7" stroke-opacity="0.35"/>
    <circle cx="803" cy="222" r="52" fill="#081018" stroke="#10B981" stroke-opacity="0.32" stroke-dasharray="4 7"/>
    <path class="dash" d="M803 146C871 146 905 184 905 222C905 276 861 313 803 313" stroke="#38BDF8" stroke-opacity="0.65" stroke-width="2"/>
    <path class="dash" d="M803 298C735 298 701 260 701 222C701 168 745 131 803 131" stroke="#10B981" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="803" cy="222" r="26" fill="#0C1929" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="803" y="228" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">EXEC</text>
    
    <!-- Satellites -->
    <circle class="pulse pulse-b" cx="803" cy="131" r="6" fill="#38BDF8" filter="url(#softGlow)"/>
    <circle class="pulse pulse-c" cx="905" cy="222" r="6" fill="#818CF8" filter="url(#softGlow)"/>
    <circle class="pulse" cx="803" cy="313" r="6" fill="#10B981" filter="url(#softGlow)"/>
    <circle class="pulse pulse-b" cx="701" cy="222" r="6" fill="#F59E0B" filter="url(#softGlow)"/>
    
    <text x="803" y="113" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">RUST</text>
    <text x="926" y="226" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">AI / NIM</text>
    <text x="803" y="339" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">WEB / TS</text>
    <text x="672" y="226" text-anchor="end" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">PTY / CLI</text>
  </g>

  <!-- Live Console Stream Ticker -->
  <rect x="56" y="386" width="888" height="74" rx="16" fill="#080E17" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="56" y="386" width="5" height="74" rx="2.5" fill="url(#line)"/>
  <text x="80" y="430" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="900">›</text>
  <g fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="600">
    <text class="statement s1" x="108" y="430" opacity="1">Crafting TerminalVision: Native Rust file cockpit &amp; live PTY.</text>
    <text class="statement s2" x="108" y="430" opacity="0">Architecting Project Alpha: High-stakes AI decision intelligence.</text>
    <text class="statement s3" x="108" y="430" opacity="0">Shipping TypeTasks: Keyboard-first high-performance workspace.</text>
    <text class="statement s4" x="108" y="430" opacity="0">Engineering NO CAP: Social rumour verification desk + Gemma 4.</text>
    <text class="statement s5" x="108" y="430" opacity="0">Architecting local-first, zero-bloat developer tools.</text>
  </g>
  <text x="918" y="430" text-anchor="end" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" letter-spacing="1.5">FEED: LIVE</text>
  
  <!-- Telemetry Baseline -->
  <path d="M56 484H944" stroke="#1E293B"/>
  <text x="56" y="502" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">ENGINEERING ETHOS: SHIP HONEST CODE  •  RESPECT THE THREAD  •  ELIMINATE LATENCY</text>
  <text x="944" y="502" text-anchor="end" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" letter-spacing="1">GITHUB.COM/TACE-X</text>
</svg>
