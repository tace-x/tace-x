<svg width="900" height="740" viewBox="0 0 900 740" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Engineering Stack &amp; Toolchain — Immanuel Melbin (@tace-x)</title>
  <desc>Verified public repository toolchain spanning native systems, AI platforms, product UI, and cloud backends.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="20" x2="876" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F17"/><stop offset="1" stop-color="#05080E"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#FFFFFF" stroke-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Background Panel -->
  <rect x="1" y="1" width="898" height="738" rx="28" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>
